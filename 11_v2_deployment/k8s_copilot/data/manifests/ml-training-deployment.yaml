apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ml-training
    environment: production
    version: v1.0.0
  name: ml-training
  namespace: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-training
  template:
    metadata:
      labels:
        app: ml-training
        version: v1.0.0
    spec:
      containers:
      - env:
        - name: APP_ENV
          value: production
        - name: LOG_LEVEL
          value: info
        image: ml-training:latest
        name: ml-training
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 2000m
            memory: 8Gi
            nvidia.com/gpu: '1'
          requests:
            cpu: 1000m
            memory: 4Gi
            nvidia.com/gpu: '1'
