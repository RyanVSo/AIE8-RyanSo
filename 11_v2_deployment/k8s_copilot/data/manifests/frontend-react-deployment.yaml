apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend-react
    environment: production
    version: v1.0.0
  name: frontend-react
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend-react
  template:
    metadata:
      labels:
        app: frontend-react
        version: v1.0.0
    spec:
      containers:
      - env:
        - name: APP_ENV
          value: production
        - name: LOG_LEVEL
          value: info
        image: frontend-react:latest
        name: frontend-react
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
