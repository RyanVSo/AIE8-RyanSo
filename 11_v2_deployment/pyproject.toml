[project]
name = "k8s-copilot"
version = "0.2.0"
description = "Agentic RAG system for Kubernetes management - Vercel Deployment"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "qdrant-client>=1.11.0",
    "langchain-qdrant>=0.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-cohere>=0.1.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["k8s_copilot"]






