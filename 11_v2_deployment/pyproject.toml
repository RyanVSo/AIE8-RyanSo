[project]
name = "k8s-copilot"
version = "0.2.0"
description = "Agentic RAG system for Kubernetes management - Vercel Deployment"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "langchain-core>=0.3.0", 
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "mangum>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["k8s_copilot"]






