[project]
name = "k8s-rag-copilot"
version = "0.1.0"
description = "End-to-end RAG agent for Kubernetes documentation with advanced retrieval methods"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-cohere>=0.3.0",
    "langgraph>=0.2.0",
    "qdrant-client>=1.11.0",
    "langchain-qdrant>=0.2.0",
    "streamlit>=1.39.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "ragas>=0.2.0",
    "plotly>=5.17.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.8.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.0.0",
    "scikit-learn>=1.3.0",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["k8s_rag"]
