apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx-deployment
    environment: production
    version: v1.0.0
  name: nginx-deployment
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-deployment
  template:
    metadata:
      labels:
        app: nginx-deployment
        version: v1.0.0
    spec:
      containers:
      - env:
        - name: APP_ENV
          value: production
        - name: LOG_LEVEL
          value: info
        image: nginx-deployment:latest
        name: nginx-deployment
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginx-deployment
  name: nginx-deployment-service
  namespace: default
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: nginx-deployment
  type: ClusterIP
---
apiVersion: v1
data:
  app_config.yaml: "\napp:\n  name: nginx-deployment\n  debug: false\n  workers: 4\n\
    logging:\n  level: info\n  format: json\n"
  database_url: postgresql://db:5432/app
  redis_url: redis://redis:6379
kind: ConfigMap
metadata:
  name: nginx-deployment-config
  namespace: default
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
  name: nginx-deployment-ingress
  namespace: default
spec:
  rules:
  - host: nginx-deployment.example.com
    http:
      paths:
      - backend:
          service:
            name: nginx-deployment-service
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - nginx-deployment.example.com
    secretName: nginx-deployment-tls
---
