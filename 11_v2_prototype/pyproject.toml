[project]
name = "k8s-copilot"
version = "0.1.0"
description = "Agentic RAG system for Kubernetes management"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "qdrant-client>=1.11.0",
    "langchain-qdrant>=0.2.0",
    "streamlit>=1.39.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "kubernetes>=31.0.0",
    "ragas>=0.2.0",
    "plotly>=5.17.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["k8s_copilot"]






