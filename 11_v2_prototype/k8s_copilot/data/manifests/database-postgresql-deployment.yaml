apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: database-postgresql
    environment: production
    version: v1.0.0
  name: database-postgresql
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database-postgresql
  template:
    metadata:
      labels:
        app: database-postgresql
        version: v1.0.0
    spec:
      containers:
      - env:
        - name: APP_ENV
          value: production
        - name: LOG_LEVEL
          value: info
        image: database-postgresql:latest
        name: database-postgresql
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 500m
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 1Gi
