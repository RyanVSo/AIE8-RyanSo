apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api-server
    environment: production
    version: v1.0.0
  name: api-server
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
        version: v1.0.0
    spec:
      containers:
      - env:
        - name: APP_ENV
          value: production
        - name: LOG_LEVEL
          value: info
        image: api-server:latest
        name: api-server
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 512Mi
